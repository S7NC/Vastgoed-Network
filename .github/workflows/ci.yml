name: Validate Theme

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          I18N_BROWSER_TESTS: "1"
      - run: npm run build
      - run: npm run test:browser
      - run: npm run package
      - run: npx gscan dist/vastgoed.zip --zip --verbose
      - run: npx gscan dist/vastgoed.zip --zip --v5 --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: vastgoed-ghost-theme
          path: |
            dist/vastgoed.zip
            routes.yaml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy Theme
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-theme-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download validated theme
        uses: actions/download-artifact@v4
        with:
          name: vastgoed-ghost-theme
          path: .
      - name: Upload theme to site
        uses: TryGhost/action-deploy-theme@v2
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          file: dist/vastgoed.zip
